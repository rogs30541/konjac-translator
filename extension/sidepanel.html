<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg:#12141a; --panel:#1b1e27; --panel2:#232734; --line:#2e3342;
    --tx:#e8eaf0; --tx2:#9aa1b4; --tx3:#6b7288;
    --brand:#ff8fa3; --brand-deep:#e5637e; --ok:#5ad08a;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--bg); color:var(--tx);
    font-family:"Segoe UI","Noto Sans TC",sans-serif;
    display:flex; flex-direction:column; height:100vh; font-size:13px;
  }
  header {
    display:flex; align-items:center; gap:8px;
    padding:11px 13px; border-bottom:1px solid var(--line);
  }
  header .logo { width:20px; height:20px; border-radius:6px;
    background:linear-gradient(135deg,var(--brand),var(--brand-deep)); }
  header b { font-size:13px; }
  #status { margin-left:auto; font-size:10.5px; color:var(--tx3); }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--brand-deep); }
  .ctl { display:flex; gap:7px; padding:10px 12px; border-bottom:1px solid var(--line); }
  button {
    flex:1; background:var(--panel2); border:1px solid var(--line);
    color:var(--tx2); border-radius:8px; padding:7px 4px;
    font-size:11.5px; cursor:pointer;
  }
  button.on { background:rgba(255,143,163,.14); border-color:var(--brand-deep);
    color:var(--brand); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  #caps { flex:1; overflow-y:auto; padding:10px 12px;
    display:flex; flex-direction:column; gap:8px; }
  .cap { background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:8px 11px; }
  .cap .src { color:var(--tx3); font-size:11px; margin-bottom:2px; }
  .cap .dst { font-size:12.5px; }
  .cap .spk { display:inline-block; border-radius:99px; padding:0 7px;
    font-size:9.5px; font-weight:600; margin-right:5px; }
  .hint { color:var(--tx3); text-align:center; margin:auto; padding:0 20px; line-height:1.7; }
  footer { padding:10px 12px; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:7px; }
  #nblm { background:#1a2030; border-color:#2c3a5c; color:#8ab0ff;
    font-weight:600; padding:9px; }
  #msg { font-size:11px; color:var(--tx3); min-height:14px; }
  #recdot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--brand); margin-right:5px; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
</style>
</head>
<body>
  <header>
    <span class="logo"></span><b>翻譯蒟蒻</b>
    <span id="status">連線中…</span>
  </header>
  <div class="ctl">
    <button id="btn-capture">● 錄製此分頁</button>
    <button id="btn-summary" disabled>✨ 摘要</button>
  </div>
  <div id="caps"><div class="hint" id="hint">
    正在探測本地引擎…<br/>
    ・桌面 App 錄製中 → 這裡即時鏡像字幕<br/>
    ・「錄製此分頁」→ 停止後上傳引擎轉錄翻譯
  </div></div>
  <footer>
    <button id="nblm" disabled>📤 傳送到 NotebookLM</button>
    <div id="msg"></div>
  </footer>
  <audio id="monitor" autoplay></audio>
  <script src="sidepanel.js"></script>
</body>
</html>
